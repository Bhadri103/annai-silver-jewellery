name: annai-jewellery

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-annai_jewellery}
      MYSQL_USER: ${DB_USER:-annai_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-annai_jewellery}
      DB_USER: ${DB_USER:-annai_app}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGIN: https://${DOMAIN},https://www.${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      USER_SESSION_HOURS: ${USER_SESSION_HOURS:-168}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      ADMIN_ORDER_EMAIL: ${ADMIN_ORDER_EMAIL:-annaisilverjewellerytky@gmail.com}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Annai Silver Jewellery}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      ADMIN_RECOVERY_EMAIL: ${ADMIN_RECOVERY_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  mysql_data:
  uploads_data:
